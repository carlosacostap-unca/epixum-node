schema: spec-driven

context: |
  Epixum es una plataforma web académica para un curso de Node.js.
  Stack: Next.js App Router, React, TypeScript, Tailwind CSS y PocketBase.
  Roles: admin, docente y estudiante.
  PocketBase es la fuente de verdad para usuarios, sprints, clases, trabajos,
  recursos, entregas, equipos, mensajes, consultas, respuestas, encuestas y revisiones.
  Las especificaciones base describen el comportamiento brownfield observado en el código.

